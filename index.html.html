<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JEE Prep Platform</title>
<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a;
    --muted: #64748b; --accent: #4f46e5; --accent-soft: #eef2ff; --warn: #b45309; --warn-soft: #fef3c7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #020617; --surface: #0f172a; --border: #1e293b; --text: #f1f5f9;
      --muted: #94a3b8; --accent: #818cf8; --accent-soft: #1e1b4b; --warn: #fcd34d; --warn-soft: #422006;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar-top { max-width: 1040px; margin: 0 auto; padding: 10px 16px 0; }
  .brand { font-weight: 700; margin-bottom: 8px; }
  nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; }
  nav button { flex: none; border: 1px solid transparent; background: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  nav button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 80px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { margin-top: 0; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  .hint { margin: 12px 0; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .split { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .btn { display: inline-block; border-radius: 10px; padding: 9px 16px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn.danger { color: #dc2626; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .link { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  .notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  .bar-track { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
  .label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 6px; }
  .ringbox { text-align: center; }
  .milestones { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
  .ms { font-size: 11px; text-align: center; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--border); color: var(--muted); }
  .ms.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .ms.past { color: var(--text); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .group-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 8px; }
  .chrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; background: var(--surface); }
  .chrow .name { flex: 1; min-width: 0; }
  .chrow .meta { font-size: 12px; color: var(--muted); }
  .sym { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 16px; color: var(--text); flex: none; }
  .sym.in { color: var(--warn); }
  .sym.done { background: var(--accent); color: #fff; border-color: var(--accent); }
  .task { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .task:last-child { border-bottom: none; }
  .task.doneT { opacity: .55; }
  .task input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .form .full { grid-column: 1 / -1; }
  .form .actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 0; }
  legend { font-size: 13px; color: var(--muted); padding: 0 4px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; margin: 4px 12px 4px 0; font-size: 14px; color: var(--text); }
  .chk input { width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .kvgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kv { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .kv span { display: block; font-size: 12px; color: var(--muted); }
  .kv b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .hb { display: grid; grid-template-columns: 150px 1fr 70px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 14px; }
  .hb b { text-align: right; font-variant-numeric: tabular-nums; }
  .vbars { display: flex; align-items: flex-end; gap: 6px; min-height: 150px; padding-top: 8px; overflow-x: auto; }
  .vb { flex: 1; min-width: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .vb b { font-size: 11px; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .vb small { font-size: 10px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .vcol { width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; }
  .list-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .list-item:last-child { border-bottom: none; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .recs li { margin-bottom: 6px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 600px) { .hb { grid-template-columns: 100px 1fr 60px; } .split { grid-template-columns: 1fr; } }

  .owner-card { max-width: 560px; margin: 0 auto; overflow: hidden; padding: 0; }
  .owner-head { background: linear-gradient(135deg, #1e3a8a, #4f46e5); color: #fff; padding: 28px 24px 70px; text-align: center; }
  .owner-head .tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .owner-photo { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; object-position: center top; border: 4px solid var(--surface); margin: -80px auto 0; display: block; background: #93c5fd; }
  .owner-body { padding: 16px 24px 26px; text-align: center; }
  .owner-body h1 { font-size: 26px; margin: 6px 0 2px; }
  .owner-body .role { color: var(--accent); font-weight: 600; }
  .owner-body .desc { color: var(--muted); font-size: 14px; margin: 14px auto 0; max-width: 420px; }
  .owner-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; text-align: left; }
  .owner-meta div { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  .owner-meta span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .site-footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }

  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .chwrap { margin-bottom: 6px; }
  .chdetail { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 6px 0 10px; }
  .lecgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
  .lec { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; cursor: pointer; background: var(--surface); }
  .lec.on { border-color: var(--accent); background: var(--accent-soft); }
  .lec input { width: auto; }
  .inline { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .inline input { width: 110px; }
  .next { font-size: 14px; margin-top: 10px; }
  .status { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--border); color: var(--text); }
  .status.ok { background: #dcfce7; color: #166534; }
  .status.warn { background: var(--warn-soft); color: var(--warn); }
  .status.bad { background: #fee2e2; color: #991b1b; }
  .continue { border: 2px solid var(--accent); }
  .complete { background: linear-gradient(135deg, #1e3a8a, #4f46e5); color: #fff; border: none; }
  .complete .muted { color: #c7d2fe; }
  .complete .pill { background: rgba(255,255,255,.18); color: #fff; }
  .celebrate { border-left: 4px solid var(--accent); }
  .fade { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .roadmap .rm { display: flex; gap: 10px; align-items: center; padding: 8px 0; color: var(--muted); font-size: 14px; border-bottom: 1px dashed var(--border); }
  .roadmap .rm:last-child { border-bottom: none; }
  .roadmap .rm.past { color: var(--text); }
  .roadmap .rm.now { color: var(--accent); font-weight: 600; }
  .roadmap .dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
  .roadmap .rm.past .dot { background: var(--accent); color: #fff; border-color: var(--accent); }
  .roadmap .rm.now .dot { border-color: var(--accent); }
  .roadmap em { margin-left: auto; font-size: 12px; font-style: normal; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  @media (max-width: 600px) { .lecgrid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } }
</style>
</head>
<body>
<header>
  <div class="bar-top">
    <div class="brand">JEE Prep Platform</div>
    <nav>
      <button data-nav="dashboard">Dashboard</button>
      <button data-nav="syllabus">Syllabus</button>
      <button data-nav="plan">Study Plan</button>
      <button data-nav="pyq">PYQs</button>
      <button data-nav="tests">Tests</button>
      <button data-nav="mistakes">Mistake Book</button>
      <button data-nav="revision">Revision</button>
      <button data-nav="analytics">Analytics</button>
      <button data-nav="profile">Profile</button>
      <button data-nav="about">Owner</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
/* =========================================================
   Syllabus seed. Mirrors the brief; confirm against the official NTA syllabus.
   ========================================================= */
const SUBJECTS = [
  { id: "physics", label: "Physics" },
  { id: "chemistry", label: "Chemistry" },
  { id: "mathematics", label: "Mathematics" },
];
const CHAPTERS = [
  ...["Units and Measurements","Kinematics","Laws of Motion","Work, Energy and Power","System of Particles and Rotational Motion","Gravitation","Properties of Solids and Liquids","Thermodynamics","Kinetic Theory","Oscillations","Waves"].map((n,i)=>({id:"phy11-"+i,subject:"physics",group:"Class 11",name:n})),
  ...["Electric Charges and Fields","Electrostatic Potential and Capacitance","Current Electricity","Moving Charges and Magnetism","Magnetism and Matter","Electromagnetic Induction","Alternating Current","Electromagnetic Waves","Ray Optics","Wave Optics","Dual Nature of Matter","Atoms","Nuclei","Semiconductor Electronics"].map((n,i)=>({id:"phy12-"+i,subject:"physics",group:"Class 12",name:n})),
  ...["Some Basic Concepts of Chemistry","Atomic Structure","Chemical Thermodynamics","Equilibrium","Redox Reactions","Solutions","Electrochemistry","Chemical Kinetics"].map((n,i)=>({id:"chePhy-"+i,subject:"chemistry",group:"Physical",name:n})),
  ...["Periodic Classification","Chemical Bonding","Coordination Compounds","p-Block Elements","d- and f-Block Elements","Metallurgy"].map((n,i)=>({id:"cheInorg-"+i,subject:"chemistry",group:"Inorganic",name:n})),
  ...["Basic Principles of Organic Chemistry","Hydrocarbons","Haloalkanes and Haloarenes","Alcohols, Phenols and Ethers","Aldehydes, Ketones and Carboxylic Acids","Amines","Biomolecules","Polymers","Chemistry in Everyday Life"].map((n,i)=>({id:"cheOrg-"+i,subject:"chemistry",group:"Organic",name:n})),
  ...["Sets","Relations and Functions","Trigonometry","Complex Numbers","Quadratic Equations","Permutations and Combinations","Binomial Theorem","Sequences and Series","Straight Lines","Circles","Conic Sections","Limits","Statistics","Probability"].map((n,i)=>({id:"mat11-"+i,subject:"mathematics",group:"Class 11",name:n})),
  ...["Relations and Functions","Inverse Trigonometric Functions","Matrices","Determinants","Continuity and Differentiability","Applications of Derivatives","Integrals","Applications of Integrals","Differential Equations","Vector Algebra","Three Dimensional Geometry","Probability"].map((n,i)=>({id:"mat12-"+i,subject:"mathematics",group:"Class 12",name:n})),
];
const REVISION_OFFSETS = [1, 3, 7, 14, 30];
const MILESTONES = [[0,25,"Foundation"],[25,50,"Building"],[50,75,"Strong Preparation"],[75,90,"Advanced Preparation"],[90,101,"Full Syllabus Completed"]];
const PYQ_YEARS = [2026,2025,2024,2023,2022,2021,2020,2019];

/* =========================================================
   Storage (per browser). Replace with Supabase when the backend exists.
   ========================================================= */
const KEY = "jee-prep-v2";
const DEFAULT = {
  profile: { name: "", cls: "Class 12", exam: "JEE Main", level: "Beginner", target: "", percentile: "", college: "", hours: 4, examDate: "", weak: [] },
  chapters: {},   // id -> { status: 'not'|'in'|'done', completedOn }
  revisions: [],  // { id, chapterId, due, offset, done }
  pyq: [],        // { id, date, exam, subject, chapterId, year, difficulty, attempted, correct, minutes }
  tests: [],      // { id, date, name, type, chapterId, total, attempted, correct, wrong, skipped, minutes, subj }
  mistakes: [],   // { id, date, subject, chapterId, category, note, correctCount, resolved }
  studyLog: [],   // { date, minutes }
  activity: [],   // dates with any activity
  plans: {},      // date -> { tasks: [...] }
  lectures: {},   // chapterId -> { total, checked: [bool] }
  notes: {},      // chapterId -> bool
  last: null,     // { chapterId, lecture, kind, at }
  achieved: [],   // achievement ids already earned
  celebrate: [],  // newly unlocked titles to show
  seeded: false,
};
function load() {
  try { return Object.assign(structuredClone(DEFAULT), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch (e) { return structuredClone(DEFAULT); }
}
let S = load();
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* =========================================================
   Helpers
   ========================================================= */
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return fmt(d); }
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const subj = id => SUBJECTS.find(s => s.id === id);
const chap = id => CHAPTERS.find(c => c.id === id);
const st = id => S.chapters[id]?.status || "not";
const pctOf = list => list.length ? Math.round(list.filter(c => st(c.id) === "done").length / list.length * 100) : 0;
const SYM = { not: "☐", in: "◐", done: "✓" };
const SYM_LABEL = { not: "Not started", in: "In progress", done: "Completed" };

function touch() { const t = today(); if (!S.activity.includes(t)) S.activity.push(t); }
function logMinutes(m) {
  const t = today();
  let e = S.studyLog.find(x => x.date === t);
  if (!e) { e = { date: t, minutes: 0 }; S.studyLog.push(e); }
  e.minutes = Math.max(0, e.minutes + m);
}
function streak() {
  const set = new Set(S.activity);
  const d = new Date();
  if (!set.has(fmt(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2500);
}
function milestone(p) { return (MILESTONES.find(([a, b]) => p >= a && p < b) || MILESTONES[MILESTONES.length-1])[2]; }
function pctBar(v, label) {
  return `<div><div class="label"><span>${esc(label)}</span><span>${v}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div></div>`;
}
function ring(p) {
  const r = 70, c = 2 * Math.PI * r, off = c * (1 - p / 100);
  return `<svg width="170" height="170" viewBox="0 0 160 160" role="img" aria-label="${p}% complete">
    <circle cx="80" cy="80" r="70" stroke="var(--border)" stroke-width="12" fill="none"/>
    <circle cx="80" cy="80" r="70" stroke="var(--accent)" stroke-width="12" fill="none" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 80 80)"/>
    <text x="80" y="88" text-anchor="middle" font-size="28" font-weight="700" fill="var(--text)">${p}%</text></svg>`;
}
function hbar(label, pct, text) {
  return `<div class="hb"><span>${esc(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,pct)}%"></div></div><b>${esc(text ?? pct+"%")}</b></div>`;
}
function vbars(items, max) {
  if (!items.length) return `<div class="empty">No data yet.</div>`;
  max = max || Math.max(1, ...items.map(i => i.v));
  return `<div class="vbars">${items.map(i => `<div class="vb"><b>${esc(i.t ?? i.v)}</b><div class="vcol" style="height:${Math.max(2, Math.round(i.v / max * 120))}px"></div><small>${esc(i.l)}</small></div>`).join("")}</div>`;
}
function chapterOptions(sel = "") {
  return `<option value="">Any chapter</option>` + SUBJECTS.map(s =>
    `<optgroup label="${s.label}">${CHAPTERS.filter(c => c.subject === s.id).map(c =>
      `<option value="${c.id}" ${sel === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</optgroup>`).join("");
}
function subjectOptions(sel = "") {
  return SUBJECTS.map(s => `<option value="${s.id}" ${sel === s.id ? "selected" : ""}>${s.label}</option>`).join("");
}

/* =========================================================
   Core actions
   ========================================================= */
function setStatus(id, status) {
  const prev = st(id);
  if (prev === status) return;
  S.chapters[id] = { status, completedOn: status === "done" ? (S.chapters[id]?.completedOn || today()) : null };
  if (status === "done" && prev !== "done") {
    REVISION_OFFSETS.forEach(n => S.revisions.push({ id: uid(), chapterId: id, due: addDays(today(), n), offset: n, done: false }));
  }
  if (status !== "done" && prev === "done") {
    S.revisions = S.revisions.filter(r => !(r.chapterId === id && !r.done));
  }
  touch(); persist();
}
function cycleStatus(id) {
  const order = ["not", "in", "done"];
  setStatus(id, order[(order.indexOf(st(id)) + 1) % 3]);
  S.last = { chapterId: id, lecture: null, kind: "status", at: new Date().toISOString() };
  persist();
}
function buildPlan() {
  const p = S.profile;
  const mins = Math.round((+p.hours || 4) * 60);
  const weak = p.weak || [];
  const dueRev = S.revisions.filter(r => !r.done && r.due <= today());
  const pyqMin = p.level === "Beginner" ? 20 : p.level === "Intermediate" ? 30 : 45;
  const revMin = dueRev.length ? (mins >= 120 ? 30 : 15) : 0;
  const studyMin = Math.max(30, mins - pyqMin - revMin);
  const active = SUBJECTS.map(s => ({ s, next: CHAPTERS.find(c => c.subject === s.id && st(c.id) !== "done") })).filter(r => r.next);
  const weightOf = id => weak.includes(id) ? 1.5 : 1;
  const W = active.reduce((a, r) => a + weightOf(r.s.id), 0) || 1;
  const tasks = active.map(r => {
    const m = Math.round(studyMin * weightOf(r.s.id) / W);
    const verb = st(r.next.id) === "in" ? "Continue" : "Start";
    return { type: "study", chapterId: r.next.id, label: `${r.s.label} — ${r.next.name}`,
      detail: `${verb} theory${p.level === "Advanced" ? " and solve difficult questions" : ""}`, minutes: m, done: false };
  });
  if (revMin) tasks.push({ type: "revision", label: "Revision", detail: `${dueRev.length} topic(s) due today`, minutes: revMin, done: false });
  tasks.push({ type: "pyq", label: "PYQs", detail: p.level === "Beginner" ? "Basic questions from your current chapter" : p.level === "Advanced" ? "Hard PYQs, timed" : "Mixed-difficulty PYQs", minutes: pyqMin, done: false });
  if (p.level === "Advanced" && mins >= 180) tasks.push({ type: "test", label: "Mock test", detail: "Timed test, then review every mistake", minutes: 60, done: false });
  return tasks;
}
function togglePlanTask(i) {
  const plan = S.plans[today()];
  if (!plan) return;
  const t = plan.tasks[i];
  t.done = !t.done;
  if (t.done) {
    logMinutes(t.minutes);
    if (t.type === "study") setStatus(t.chapterId, "done");
    if (t.type === "revision") S.revisions.forEach(r => { if (!r.done && r.due <= today()) r.done = true; });
  } else {
    logMinutes(-t.minutes);
    if (t.type === "study" && st(t.chapterId) === "done") setStatus(t.chapterId, "in");
  }
  touch(); persist();
}
function saveWrongToMistakes(count, subject, chapterId, category, note) {
  for (let i = 0; i < count; i++) {

}

function subjectStats() {
  const r = {};
  SUBJECTS.forEach(s => r[s.id] = { a: 0, c: 0 });
  S.pyq.forEach(p => { r[p.subject].a += p.attempted; r[p.subject].c += p.correct; });
  S.tests.forEach(t => SUBJECTS.forEach(s => { const x = t.subj?.[s.id]; if (x) { r[s.id].a += x.a; r[s.id].c += x.c; } }));
  return r;
}
function weakAreas() {
  const agg = {};
  const g = id => agg[id] || (agg[id] = { a: 0, c: 0, m: 0 });
  S.pyq.forEach(p => { if (p.chapterId) { const x = g(p.chapterId); x.a += p.attempted; x.c += p.correct; } });
  S.mistakes.forEach(m => { if (m.chapterId && !m.resolved) g(m.chapterId).m++; });
  return Object.entries(agg)
    .map(([id, x]) => ({ id, acc: x.a ? Math.round(x.c / x.a * 100) : null, a: x.a, m: x.m }))
    .filter(x => (x.a >= 5 && x.acc < 60) || x.m >= 3)
    .sort((p, q) => (p.acc ?? 0) - (q.acc ?? 0));
}
function recommendations() {
  const out = [];
  const ss = subjectStats();
  const acc = s => Math.round(ss[s.id].c / ss[s.id].a * 100);
  const withData = SUBJECTS.filter(s => ss[s.id].a >= 5);
  if (withData.length) {
    const weakest = [...withData].sort((a, b) => acc(a) - acc(b))[0];
    out.push(`${weakest.label} is your weakest subject so far (${acc(weakest)}% accuracy).`);
  }
  const w = weakAreas();
  if (w.length) out.push(`Revisit: ${w.slice(0, 3).map(x => chap(x.id).name).join(", ")}.`);
  const next = CHAPTERS.find(c => st(c.id) !== "done");
  if (next) out.push(`Next chapter in your syllabus: ${next.name}.`);
  if (!out.length) out.push("Log PYQ or test results to get personalized recommendations.");
  return out;
}
function monthlyCompletion() {
  const counts = {};
  CHAPTERS.forEach(c => {
    const d = S.chapters[c.id];
    if (d?.status === "done" && d.completedOn) { const m = d.completedOn.slice(0, 7); counts[m] = (counts[m] || 0) + 1; }
  });
  let run = 0;
  return Object.keys(counts).sort().map(m => { run += counts[m]; return { l: m, v: Math.round(run / CHAPTERS.length * 100), t: Math.round(run / CHAPTERS.length * 100) + "%" }; });
}

let openChap = null;
const nowIso = () => new Date().toISOString();
function fmtWhen(iso) { try { return new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return ""; } }
const pureClass = n => CHAPTERS.filter(c => c.group === "Class " + n);
function scopeFor(cls) {
  if (cls === "Class 11") return CHAPTERS.filter(c => c.group === "Class 11" || c.subject === "chemistry");
  if (cls === "Class 12") return CHAPTERS.filter(c => c.group === "Class 12" || c.subject === "chemistry");
  return CHAPTERS;
}
function lecInfo(id) { return S.lectures[id] || { total: 0, checked: [] }; }
function lecDone(id) { return lecInfo(id).checked.filter(Boolean).length; }
function lecTotalAll(list) { return list.reduce((a, c) => a + lecInfo(c.id).total, 0); }
function lecDoneAll(list) { return list.reduce((a, c) => a + lecDone(c.id), 0); }
function chapProgress(id) {
  if (st(id) === "done") return 100;
  const L = lecInfo(id);
  if (L.total) return Math.round(lecDone(id) / L.total * 100);
  return st(id) === "in" ? 50 : 0;
}
function avgOf(list) { return list.length ? Math.round(list.reduce((a, c) => a + chapProgress(c.id), 0) / list.length) : 0; }
function doneCount(list) { return list.filter(c => st(c.id) === "done").length; }
function revDoneFor(id) { return S.revisions.filter(r => r.chapterId === id && r.done).length; }
function pctRev(n) { return Math.round(CHAPTERS.filter(c => revDoneFor(c.id) >= n).length / CHAPTERS.length * 100); }
function overall() { return avgOf(CHAPTERS); }

function syncStatus(id) {
  const L = lecInfo(id);
  if (!L.total) return;
  const d = lecDone(id);
  if (d === L.total && st(id) !== "done") setStatus(id, "done");
  else if (d < L.total && st(id) === "done") setStatus(id, "in");
  else if (d > 0 && st(id) === "not") setStatus(id, "in");
}
function setLectureTotal(id, n) {
  n = Math.max(0, Math.min(200, Math.floor(n) || 0));
  const checked = lecInfo(id).checked.slice(0, n);
  while (checked.length < n) checked.push(false);
  S.lectures[id] = { total: n, checked };
  syncStatus(id); touch(); persist();
}
function toggleLecture(id, i) {
  const L = lecInfo(id);
  if (!L.total) return;
  const checked = L.checked.slice();
  checked[i] = !checked[i];
  S.lectures[id] = { total: L.total, checked };
  S.last = { chapterId: id, lecture: i + 1, kind: "lecture", at: nowIso() };
  syncStatus(id); touch(); persist();
}
function toggleNotes(id) {
  S.notes[id] = !S.notes[id];
  S.last = { chapterId: id, lecture: null, kind: "notes", at: nowIso() };
  touch(); persist();
}

function examDays() {
  const e = S.profile.examDate;
  if (!e) return null;
  return Math.round((new Date(e + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000);
}
function paceFor(list) {
  const remaining = list.length - doneCount(list);
  if (remaining === 0) return { cls: "ok", label: "🟢 On Track", note: "Complete." };
  const days = examDays();
  if (days === null) return { cls: "", label: "Set exam date", note: "Add your target exam date in Profile to see your pace." };
  if (days <= 0) return { cls: "bad", label: "🔴 Behind Schedule", note: "Target date has passed." };
  if (doneCount(list) === 0) return { cls: "", label: "Not started", note: "Complete a chapter to see your pace." };
  const from = addDays(today(), -28);
  const recentN = list.filter(c => { const d = S.chapters[c.id]; return d && d.status === "done" && d.completedOn && d.completedOn > from; }).length;
  const recent = recentN / 28, need = remaining / days;
  const ratio = need > 0 ? recent / need : 1;
  const finish = recent > 0 ? addDays(today(), Math.ceil(remaining / recent)) : null;
  const base = ratio >= 1 ? { cls: "ok", label: "🟢 On Track" }
    : ratio >= 0.6 ? { cls: "warn", label: "🟡 Slightly Behind" }
    : { cls: "bad", label: "🔴 Behind Schedule" };
  return { ...base, finish, note: finish ? "Estimated finish at your recent pace: " + finish : "No chapters completed in the last 28 days." };
}

    S.seeded = true;
    fresh.forEach(a => S.achieved.push(a.id));
    persist();
    return;
  }
  if (!fresh.length) return;
  fresh.forEach(a => S.achieved.push(a.id));

function chapDetail(c) {

  const revs = S.revisions.filter(r => r.chapterId === c.id).sort((a, b) => a.due.localeCompare(b.due));
  const revDone = revs.filter(r => r.done).length;
  const nextIdx = L.total ? L.checked.findIndex(x => !x) : -1;
  const nextTxt = s === "done" ? "Revise (see Revision page)"
    : nextIdx >= 0 ? "Lecture " + (nextIdx + 1)
    : L.total ? "All lectures done. Mark chapter complete."
    : "Set a lecture count to track lectures.";
  return `<div class="chdetail">
    <div class="kvgrid">
      <div class="kv"><span>Chapter completion</span><b>${chapProgress(c.id)}%</b></div>
      <div class="kv"><span>Lectures completed</span><b>${L.total ? lecDone(c.id) + " / " + L.total : "—"}</b></div>
      <div class="kv"><span>Lectures remaining</span><b>${L.total ? L.total - lecDone(c.id) : "—"}</b></div>
      <div class="kv"><span>Revisions</span><b>${revDone} / ${revs.length} scheduled</b></div>
    </div>
    <h3>Lectures</h3>
    ${L.total ? `<div class="lecgrid">${L.checked.map((v, i) => `<label class="lec ${v ? "on" : ""}"><input type="checkbox" data-act="lec" data-id="${c.id}" data-i="${i}" ${v ? "checked" : ""}/> Lecture ${i + 1}</label>`).join("")}</div>`

function renderSyllabus() {

function renderPYQ() {

        <label>Subject ${sel("subject", SUBJECTS.map(s => ({v:s.id,l:s.label})), f.subject)}</label>
        <label>Difficulty ${sel("difficulty", ["Easy","Medium","Hard"].map(d => ({v:d,l:d})), f.difficulty)}</label>

function testCard(t) {
  const acc = t.attempted ? Math.round(t.correct / t.attempted * 100) : 0;
  const subs = SUBJECTS.map(s => { const x = t.subj?.[s.id]; return x && x.a ? `<div class="kv"><span>${s.label}</span><b>${Math.round(x.c / x.a * 100)}%</b> <span>${x.c}/${x.a}</span></div>` : ""; }).join("");
  return `<div class="card">
    <h2>${esc(t.name)} <span class="muted">· ${esc(t.type)} · ${t.date}</span></h2>
    <div class="kvgrid">
      <div class="kv"><span>Raw score (correct − wrong)</span><b>${t.correct - t.wrong}</b></div>
      <div class="kv"><span>Accuracy</span><b>${acc}%</b></div>
      <div class="kv"><span>Attempted</span><b>${t.attempted}</b></div>
      <div class="kv"><span>Correct</span><b>${t.correct}</b></div>
      <div class="kv"><span>Wrong</span><b>${t.wrong}</b></div>
      <div class="kv"><span>Skipped</span><b>${t.skipped}</b></div>

    <div class="muted" style="margin-top:10px">Raw score is a count only. Official marking scheme is not applied, and no percentile is estimated here.</div>
  </div>`;
}

function renderAnalytics() {
  const ss = subjectStats();
  const pyqA = S.pyq.reduce((a, p) => a + p.attempted, 0);
  const pyqC = S.pyq.reduce((a, p) => a + p.correct, 0);
  const testA = S.tests.reduce((a, t) => a + t.attempted, 0);
  const testC = S.tests.reduce((a, t) => a + t.correct, 0);
  const totalA = pyqA + testA, totalC = pyqC + testC;
  const minutes = S.studyLog.reduce((a, e) => a + e.minutes, 0);
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const end = addDays(today(), -7 * i), start = addDays(end, -6);
    const n = CHAPTERS.filter(c => { const d = S.chapters[c.id]; return d?.status === "done" && d.completedOn >= start && d.completedOn <= end; }).length;
    weeks.push({ l: start.slice(5), v: n });
  }
  const hours = [];
  for (let i = 13; i >= 0; i--) {
    const d = addDays(today(), -i);
    const m = S.studyLog.find(e => e.date === d)?.minutes || 0;
    hours.push({ l: d.slice(5), v: +(m / 60).toFixed(1), t: (m / 60).toFixed(1) });
  }
  const tests = S.tests.slice(-10).map(t => ({ l: t.date.slice(5), v: t.attempted ? Math.round(t.correct / t.attempted * 100) : 0, t: (t.attempted ? Math.round(t.correct / t.attempted * 100) : 0) + "%" }));
  const monthly = monthlyCompletion();
  const undated = CHAPTERS.filter(c => st(c.id) === "done" && !S.chapters[c.id]?.completedOn).length;
  return `
    <h1>Analytics</h1>
    <div class="stats">
      <div class="stat"><b>${pctOf(CHAPTERS)}%</b><span>Syllabus completed</span></div>
      <div class="stat"><b>${totalA}</b><span>Questions solved</span></div>
      <div class="stat"><b>${totalA ? Math.round(totalC / totalA * 100) : 0}%</b><span>Overall accuracy</span></div>
      <div class="stat"><b>${(minutes / 60).toFixed(1)}</b><span>Study hours logged</span></div>
      <div class="stat"><b>${S.tests.length}</b><span>Mock tests</span></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Syllabus completion by month</h2>
        ${vbars(monthly, 100)}
        ${undated ? `<div class="muted" style="margin-top:8px">${undated} completed chapter(s) have no date, so they aren't shown in the monthly chart.</div>` : ""}
      </div>
      <div class="card"><h2>Weekly progress (chapters, last 8 weeks)</h2>${vbars(weeks)}</div>
      <div class="card"><h2>Study hours (last 14 days)</h2>${vbars(hours)}</div>
      <div class="card"><h2>Mock test accuracy (last 10)</h2>${vbars(tests, 100)}</div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="card"><h2>Subject performance</h2>
        ${SUBJECTS.map(s => { const x = ss[s.id]; const a = x.a ? Math.round(x.c / x.a * 100) : 0; return hbar(s.label, a, x.a ? a + "% (" + x.c + "/" + x.a + ")" : "no data"); }).join("")}
      </div>
      <div class="card"><h2>Recommendations</h2>
        <ul class="recs">${recommendations().map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      </div>
    </div>`;
}

  const questions = S.pyq.reduce((a, x) => a + x.attempted, 0) + S.tests.reduce((a, x) => a + x.attempted, 0);

      <h2>Your details</h2>

        <label>Name<input type="text" name="name" value="${esc(p.name)}" /></label>
        <label>Class<select name="cls">${["Class 11","Class 12","Dropper"].map(c => `<option ${p.cls === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>Exam<select name="exam">${["JEE Main","JEE Advanced"].map(c => `<option ${p.exam === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>Preparation level<select name="level">${["Beginner","Intermediate","Advanced"].map(c => `<option ${p.level === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>

        <label>Daily study hours<input type="number" min="1" max="12" name="hours" value="${esc(p.hours)}" /></label>

      </form>
    </div>
    <div class="card">
      <h2>Backup and move your data</h2>
      <p class="muted">Your progress lives in this browser. To use it on another device, export here, copy the text, and import it there. Import replaces current data.</p>
      <textarea id="io" placeholder="Export fills this box. Paste a backup here and press Import."></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" data-act="export">Export</button>
        <button class="btn" data-act="import">Import</button>
        <button class="btn danger" data-act="reset">Reset all data</button>
      </div>
    </div>`;

const VIEWS = { about: renderAbout, dashboard: renderDashboard, syllabus: renderSyllabus, plan: renderPlan, pyq: renderPYQ, tests: renderTests, mistakes: renderMistakes, revision: renderRevision, analytics: renderAnalytics, profile: renderProfile };
let view = "dashboard";
const app = document.getElementById("app");

function render() {
  checkAchievements();
  document.querySelectorAll("nav [data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav === view));
  app.innerHTML = VIEWS[view]();
}
function go(v) { view = v; render(); window.scrollTo({ top: 0 }); }

/* =========================================================
   Events (delegated)
   ========================================================= */
document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("[data-nav]"); if (b) go(b.dataset.nav);
});
app.addEventListener("click", e => {
  const n = e.target.closest("[data-nav]"); if (n) return go(n.dataset.nav);
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case "cycle": cycleStatus(id); break;
    case "syltab": S.ui_syllabusTab = a.dataset.v; break;
    case "revdone": { const r = S.revisions.find(x => x.id === id); if (r) r.done = true; touch(); persist(); break; }
    case "solvedOk": { const m = S.mistakes.find(x => x.id === id); if (m) { m.correctCount++; if (m.correctCount >= 2) m.resolved = true; touch(); persist(); } break; }
    case "delMistake": S.mistakes = S.mistakes.filter(x => x.id !== id); persist(); break;
    case "delPyq": S.pyq = S.pyq.filter(x => x.id !== id); persist(); break;
    case "delTest": S.tests = S.tests.filter(x => x.id !== id); persist(); break;
    case "planToggle": togglePlanTask(+a.dataset.i); break;
    case "export": { const t = document.getElementById("io"); if (t) t.value = JSON.stringify(S); return; }
    case "import": {
      const t = document.getElementById("io");
      try {
        const o = JSON.parse(t.value);
        if (!o || typeof o !== "object" || !o.chapters || !o.profile) throw new Error("bad");
        S = Object.assign(structuredClone(DEFAULT), o); persist(); toast("Data imported");
      } catch (err) { toast("That doesn't look like a valid backup"); return; }
      break;
    }
    case "reset": {
      if (!confirm("Erase all progress in this browser? This can't be undone.")) return;
      S = structuredClone(DEFAULT); persist(); toast("All data reset"); break;
    }
    case "expand": openChap = openChap === id ? null : id; break;
    case "lec": toggleLecture(id, +a.dataset.i); break;
    case "notes": toggleNotes(id); break;
    case "continue": openChap = id; S.ui_syllabusTab = chap(id).subject; view = "syllabus"; break;
    case "remaining": S.ui_syllabusTab = "remaining"; view = "syllabus"; break;
    case "dismissCel": S.celebrate = []; persist(); break;
    default: return;
  }
  render();
});

app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.filter === "pyq") { S.ui_pyqFilter = S.ui_pyqFilter || {}; S.ui_pyqFilter[el.dataset.k] = el.value; render(); }
  if (el.dataset.filter === "mistake") { S.ui_mistakeCat = el.value; render(); }
});

app.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  const kind = f.dataset.form;
  const fd = new FormData(f);
  const d = Object.fromEntries(fd.entries());

  if (kind === "lecTotal") {
    setLectureTotal(f.dataset.id, +d.n || 0);
    toast("Lecture count saved");
  }
  if (kind === "profile") {
    S.profile = {
      ...S.profile,
      name: (d.name || "").trim(), cls: d.cls, exam: d.exam, level: d.level,
      target: (d.target || "").trim(), percentile: d.percentile || "", college: (d.college || "").trim(),
      hours: +d.hours || 4, examDate: d.examDate || "", weak: fd.getAll("weak"),
    };
    persist(); toast("Profile saved");
  }

  if (kind === "plan") {
    S.profile.hours = +d.hours || 4;
    S.profile.weak = fd.getAll("weak");
    S.plans[today()] = { tasks: buildPlan() };
    touch(); persist(); toast("Plan generated");
  }

  if (kind === "pyq") {
    const attempted = +d.attempted, correct = +d.correct, minutes = +d.minutes || 0;
    if (!attempted || correct > attempted || correct < 0) { toast("Check attempted and correct"); return; }
    const chapterId = d.chapter || "";
    const subject = chapterId ? chap(chapterId).subject : d.subject;
    S.pyq.push({ id: uid(), date: today(), exam: d.exam, subject, chapterId, year: d.year, difficulty: d.difficulty, attempted, correct, minutes });
    if (fd.get("saveWrong")) saveWrongToMistakes(attempted - correct, subject, chapterId, d.category, `PYQ ${d.year} · ${d.exam}`);
    logMinutes(minutes); touch(); persist();
    toast("PYQ session saved");
  }

  if (kind === "test") {
    const total = +d.total, attempted = +d.attempted, correct = +d.correct;
    if (!total || attempted > total || correct > attempted) { toast("Check the numbers: correct ≤ attempted ≤ total"); return; }
    const subj_ = {};
    SUBJECTS.forEach(s => {
      const a = +d["a_" + s.id] || 0, c = +d["c_" + s.id] || 0;
      if (a || c) subj_[s.id] = { a, c: Math.min(a, c) };
    });
    const t = { id: uid(), date: today(), name: d.name.trim(), type: d.type, chapterId: d.chapter || "",
      total, attempted, correct, wrong: attempted - correct, skipped: total - attempted, minutes: +d.minutes || 0, subj: subj_ };
    S.tests.push(t);
    S.ui_lastTest = t.id;
    if (fd.get("saveWrong") && t.wrong) saveWrongToMistakes(t.wrong, d.chapter ? chap(d.chapter).subject : "physics", d.chapter || "", d.category, `Test: ${t.name}`);
    logMinutes(t.minutes); touch(); persist();
    toast("Test saved");
  }

  if (kind === "mistake") {
    const chapterId = d.chapter || "";
    const subject = chapterId ? chap(chapterId).subject : d.subject;
    S.mistakes.push({ id: uid(), date: today(), subject, chapterId, category: d.category, note: (d.note || "").trim(), correctCount: 0, resolved: false });
    touch(); persist(); toast("Saved to Mistake Book");
  }

  render();
});

render();
</script>
